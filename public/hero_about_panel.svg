  <path d="M74 176V155H95 M1922 155H1944V176 M74 607V629H95 M1922 629H1944V607" fill="none" stroke="#d4e6ff" stroke-width="3"/>
  <rect x="75" y="155" width="1869" height="474" fill="none" stroke="#b9d3f2" stroke-opacity=".8" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text x="126" y="229" fill="#d9e8ff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="8">HERO</text>
  <text x="295" y="229" fill="#d9e8ff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="400">/</text>
  <text x="349" y="229" fill="#d9e8ff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="7">ABOUT</text>
  <g fill="url(#bar)">
