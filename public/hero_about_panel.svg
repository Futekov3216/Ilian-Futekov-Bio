<svg xmlns="http://www.w3.org/2000/svg" viewBox="49 128 1920 527" preserveAspectRatio="none" role="img" aria-labelledby="title desc">
  <title id="title">Hero / About blueprint panel</title>
  <desc id="desc">A flat dark navy architectural blueprint-style UI panel with pale blue placeholder lines and orange and blue-gray buttons.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2d57"/>
      <stop offset="1" stop-color="#09264b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7395c3"/>
      <stop offset="1" stop-color="#6587b5"/>
    </linearGradient>
    <pattern id="microgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8fb0d6" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="2016" height="800" fill="#fff"/>
  <rect x="43" y="122" width="1932" height="539" rx="5" fill="url(#navy)" stroke="#153f70" stroke-width="5"/>
